<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>¿Quieres ser mi San Valentín? 💖</title>

<style>
/* ===== CONFIGURACIÓN GENERAL ===== */
body {
    margin: 0;
    background: #f2f2f2;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
}

/* ===== CANVAS FUEGOS ARTIFICIALES ===== */
#fireworks {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 0;
}

/* ===== CONTENEDOR CENTRAL ===== */
.card {
    position: absolute;
    z-index: 10;
    background: white;
    padding: 30px;
    border-radius: 25px;
    text-align: center;
    width: 360px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

h1 { color: #ff4d6d; }

/* ===== BOTONES ===== */
button {
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
}

.yes { background: #4CAF50; color: white; }
.no  { background: #f44336; color: white; position: absolute; }

/* ===== CARRUSELES ===== */
.strip-wrapper {
    position: absolute;
    width: 100vw;
    overflow: hidden;
    left: 0;
}

.strip-wrapper.top { top: 0; }
.strip-wrapper.bottom { bottom: 0; }

.strip {
    display: flex;
    width: max-content;
    gap: 20px;
    animation: scroll 40s linear infinite;
}

.strip.reverse { animation-direction: reverse; }

.strip img {
    width: 180px;
    height: 220px;
    object-fit: cover;
    border-radius: 15px;
}

@keyframes scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
}

/* ===== CORAZONES FLOTANTES ===== */
.heart {
    position: absolute;
    animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
    from { transform: translateY(100vh); opacity: 1; }
    to   { transform: translateY(-20vh); opacity: 0; }
}

/* ===== CORAZONES GIGANTES ===== */
.big-heart {
    position: absolute;
    font-size: 160px;
    opacity: 0.18;
    animation: pulse 3s infinite;
}

@keyframes pulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.3); }
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<!-- ===== CARRUSEL SUPERIOR (1–6) ===== -->
<div class="strip-wrapper top">
  <div class="strip">
    <img src="foto1.jpeg"><img src="foto2.jpeg"><img src="foto3.jpeg">
    <img src="foto4.jpeg"><img src="foto5.jpeg"><img src="foto6.jpeg">
    <img src="foto1.jpeg"><img src="foto2.jpeg"><img src="foto3.jpeg">
    <img src="foto4.jpeg"><img src="foto5.jpeg"><img src="foto6.jpeg">
  </div>
</div>

<!-- ===== CARRUSEL INFERIOR (7–12) ===== -->
<div class="strip-wrapper bottom">
  <div class="strip reverse">
    <img src="foto7.jpeg"><img src="foto8.jpeg"><img src="foto9.jpeg">
    <img src="foto10.jpeg"><img src="foto11.jpeg"><img src="foto12.jpeg">
    <img src="foto7.jpeg"><img src="foto8.jpeg"><img src="foto9.jpeg">
    <img src="foto10.jpeg"><img src="foto11.jpeg"><img src="foto12.jpeg">
  </div>
</div>

<!-- ===== TARJETA ===== -->
<div class="card">
    <h1>¿Quieres ser mi San Valentín? 💕</h1>
    <br>
    <button class="yes" onclick="sayYes()">Sí 💖</button>
    <button class="no" id="noBtn">No 🙃</button>
</div>

<script>
/* ===== TEXTO PERSONALIZABLE ===== */
const nombre = "Angeline";            // ← cambia aquí
const fecha = "14 de Febrero";      // ← cambia aquí
const mensajeExtra = "Gracias por hacer mis días más felices ✨";

/* ===== BOTÓN NO ===== */
const noBtn = document.getElementById('noBtn');
noBtn.addEventListener('mouseover', () => {
    noBtn.style.left = Math.random() * 300 + 'px';
    noBtn.style.top  = Math.random() * 120 + 'px';
});

/* ===== CORAZONES FLOTANTES ===== */
setInterval(() => {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerHTML = '❤️';
    heart.style.fontSize = (30 + Math.random() * 40) + 'px';
    heart.style.left = Math.random() * 100 + 'vw';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}, 200);

/* ===== FUEGOS ARTIFICIALES (CANVAS) ===== */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let particles = [];

function createFirework(x, y) {
    const colors = ["#ff4d6d", "#ffd166", "#06d6a0", "#4cc9f0"];
    for (let i = 0; i < 80; i++) {
        particles.push({
            x, y,
            angle: Math.random() * Math.PI * 2,
            speed: Math.random() * 5 + 2,
            radius: Math.random() * 3 + 1,
            life: 100,
            color: colors[Math.floor(Math.random() * colors.length)]
        });
    }
}

function animateFireworks() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach((p, i) => {
        p.x += Math.cos(p.angle) * p.speed;
        p.y += Math.sin(p.angle) * p.speed;
        p.speed *= 0.96;
        p.life--;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();

        if (p.life <= 0) particles.splice(i, 1);
    });
    requestAnimationFrame(animateFireworks);
}
animateFireworks();

/* ===== ACCIÓN AL DECIR SÍ ===== */
function sayYes() {
    document.body.innerHTML = `
        <canvas id="fireworks"></canvas>
        <div style="
            background: radial-gradient(circle, #ff758c, #ff7eb3);
            width:100vw;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            color:white;
            text-align:center;
            font-family:sans-serif;
            overflow:hidden;
        ">
            <h1>💘 Sabía que dirías que sí 💘</h1>
            <h2>Feliz ${fecha} ❤️</h2>
            <p style="font-size:20px; max-width:600px;">
                ${mensajeExtra}
            </p>
        </div>
    `;

    // corazones gigantes
    for (let i = 0; i < 10; i++) {
        const bh = document.createElement('div');
        bh.className = 'big-heart';
        bh.innerHTML = '❤️';
        bh.style.left = Math.random() * 100 + 'vw';
        bh.style.top  = Math.random() * 100 + 'vh';
        document.body.appendChild(bh);
    }

    // fuegos artificiales continuos
    setInterval(() => {
        createFirework(
            Math.random() * window.innerWidth,
            Math.random() * window.innerHeight / 2
        );
    }, 700);
}
</script>

</body>
</html>
